<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="海风城市冲刺 · 伪 3D 跑酷：小猫从海滨公路出发，穿越城市高架与霓虹街区，冲过 1000m 终点。">
<meta property="og:title" content="海风城市冲刺 · Seabreeze City Sprint">
<meta property="og:description" content="伪 3D 跑酷：换道、跳跃、吃金币，冲过 1000m 终点！">
<title>海风城市冲刺 · Seabreeze City Sprint</title>
<style>
:root{--gold:#ffd34d}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#0b1020;overscroll-behavior:none;
 font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
 -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;z-index:5;pointer-events:none}
#topbar{top:12px;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:0 14px}
.chip{background:rgba(8,14,30,.55);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.14);
 color:#fff;border-radius:14px;padding:8px 12px;font-size:14px;font-weight:700;letter-spacing:.5px;
 box-shadow:0 4px 16px rgba(0,0,0,.25)}
#coinChip b{color:var(--gold);font-size:15px}
#coinChip span{opacity:.6;font-size:12px;font-weight:600}
#speedChip b{font-size:15px;color:#9fe8ff}
#ctrlBtns{top:60px;right:14px;display:flex;flex-direction:column;gap:8px}
.iconbtn{pointer-events:auto;width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.22);
 background:rgba(8,14,30,.55);color:#fff;font-size:15px;cursor:pointer;backdrop-filter:blur(6px)}
.iconbtn:active{transform:scale(.92)}
#progWrap{top:36px;left:50%;transform:translateX(-50%);width:min(46vw,430px)}
#progBar{position:relative;height:10px;border-radius:999px;
 background:linear-gradient(90deg,#39c6ff 0 33.4%,#8a7bff 33.4% 66.7%,#ff4fd8 66.7% 100%);
 outline:2px solid rgba(255,255,255,.4);box-shadow:0 2px 12px rgba(0,0,0,.4)}
.tick{position:absolute;top:-4px;width:2px;height:18px;background:rgba(255,255,255,.55);border-radius:2px}
#marker{position:absolute;top:-24px;font-size:17px;transform:translateX(-50%);filter:drop-shadow(0 2px 3px rgba(0,0,0,.5));transition:left .12s linear}
#distText{text-align:center;color:#fff;font-size:12px;font-weight:700;margin-top:7px;letter-spacing:1.5px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
#stageBanner{position:fixed;top:20%;left:50%;transform:translateX(-50%) scale(.82);opacity:0;text-align:center;z-index:6;
 pointer-events:none;transition:opacity .45s ease,transform .45s ease}
#stageBanner.show{opacity:1;transform:translateX(-50%) scale(1)}
#stageCn{font-size:min(9vw,42px);font-weight:800;letter-spacing:10px;color:#fff;
 text-shadow:0 0 26px var(--acc,#7ec8ff),0 0 8px rgba(0,0,0,.55),0 3px 10px rgba(0,0,0,.5)}
#stageEn{font-size:12px;letter-spacing:7px;color:rgba(255,255,255,.85);margin-top:8px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
#msg{position:fixed;top:36%;left:50%;transform:translateX(-50%);font-size:30px;font-weight:800;color:#fff;
 text-shadow:0 0 18px rgba(255,211,77,.9),0 2px 8px rgba(0,0,0,.6);opacity:0;transition:opacity .25s;z-index:6;pointer-events:none;letter-spacing:6px}
#msg.show{opacity:1}
#hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.85);font-size:13px;font-weight:600;
 letter-spacing:2px;text-shadow:0 1px 4px rgba(0,0,0,.7);z-index:5;pointer-events:none;
 animation:hintFade 7s ease forwards}
@keyframes hintFade{0%,70%{opacity:1}100%{opacity:0}}
#touch{bottom:18px;left:0;right:0;display:none;justify-content:space-between;align-items:flex-end;padding:0 20px}
.tgroup{display:flex;gap:14px}
.tbtn{pointer-events:auto;width:62px;height:62px;border-radius:50%;background:rgba(8,14,30,.5);
 border:1px solid rgba(255,255,255,.25);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.tbtn:active{background:rgba(255,255,255,.18)}
.tbtn.big{width:72px;height:72px;font-size:26px}
@media (pointer:coarse){#touch{display:flex}}
.screen{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;
 background:radial-gradient(120% 90% at 50% 10%,rgba(30,50,90,.55),rgba(6,10,24,.82))}
.screen.show{display:flex}
.card{background:rgba(10,16,34,.78);border:1px solid rgba(255,255,255,.15);border-radius:24px;
 padding:28px 34px 26px;color:#fff;text-align:center;backdrop-filter:blur(12px);
 box-shadow:0 24px 70px rgba(0,0,0,.55);max-width:min(92vw,470px)}
.logo{font-size:46px;line-height:1}
.card h1{font-size:30px;margin:10px 0 4px;letter-spacing:6px;font-weight:800;
 background:linear-gradient(92deg,#7ee0ff,#ffd34d 55%,#ff7ad9);-webkit-background-clip:text;background-clip:text;color:transparent}
.card h2{font-size:24px;letter-spacing:3px;margin-bottom:8px}
.sub{font-size:11px;letter-spacing:4px;color:rgba(255,255,255,.6);margin-bottom:12px}
.desc{font-size:14px;line-height:1.7;color:rgba(255,255,255,.88);margin-bottom:12px}
.keys{font-size:12px;color:rgba(255,255,255,.66);line-height:1.9}
.mobileHint{display:none}
@media (pointer:coarse){.mobileHint{display:block}}
.best{font-size:12px;color:var(--gold);margin:8px 0 2px;min-height:16px}
.btn{pointer-events:auto;cursor:pointer;border:1px solid rgba(255,255,255,.25);color:#fff;background:rgba(255,255,255,.1);
 border-radius:999px;padding:11px 26px;font-size:15px;font-weight:700;letter-spacing:2px;margin-top:14px}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(180deg,#ffe27a,#ffb02e);border-color:#ffd34d;color:#4a2c00;
 box-shadow:0 6px 20px rgba(255,176,46,.4)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.rating{font-size:56px;font-weight:900;line-height:1;margin:6px 0 10px;
 background:linear-gradient(180deg,#ffe27a,#ff9d2e);-webkit-background-clip:text;background-clip:text;color:transparent}
.rating.small{font-size:34px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 4px}
.stat{display:flex;justify-content:space-between;gap:12px;white-space:nowrap;background:rgba(255,255,255,.07);
 border-radius:10px;padding:9px 12px;font-size:13px;color:rgba(255,255,255,.75)}
.stat b{color:#ffe08a;font-size:13px}
.tip{font-size:12px;color:rgba(255,255,255,.6);margin-top:8px;line-height:1.6}
.credit{font-size:10px;color:rgba(255,255,255,.4);margin-top:14px;letter-spacing:1px}
body.title .hud,body.title #hint,body.title #touch{display:none!important}
</style>
</head>
<body class="title">
<canvas id="game"></canvas>
<noscript>需要启用 JavaScript 才能游玩。</noscript>

<div id="topbar" class="hud">
 <div class="chip" id="coinChip">🪙 <b id="coinNum">0</b><span id="coinTot"></span></div>
 <div class="chip" id="speedChip"><b id="spdNum">0</b> km/h</div>
</div>
<div id="ctrlBtns" class="hud">
 <button id="btnPause2" class="iconbtn" title="暂停 (P)">⏸</button>
 <button id="btnMute" class="iconbtn" title="静音 (M)">🔊</button>
</div>
<div id="progWrap" class="hud">
 <div id="progBar">
  <i class="tick" style="left:34%"></i><i class="tick" style="left:68%"></i>
  <div id="marker">🐱</div>
 </div>
 <div id="distText">0 / 1000 m</div>
</div>
<div id="stageBanner"><div id="stageCn"></div><div id="stageEn"></div></div>
<div id="msg">出发！</div>
<div id="hint">← → 换道 &nbsp;·&nbsp; ↑ / 空格 跳跃 &nbsp;·&nbsp; 路锥可跳 · 路障与车辆请换道</div>
<div id="touch" class="hud">
 <div class="tgroup">
  <div class="tbtn" data-a="left">◀</div>
  <div class="tbtn" data-a="right">▶</div>
 </div>
 <div class="tbtn big" data-a="jump">▲</div>
</div>

<div id="startScreen" class="screen show">
 <div class="card">
  <div class="logo">🐱💨</div>
  <h1>海风城市冲刺</h1>
  <div class="sub">SEABREEZE CITY SPRINT · 1000M</div>
  <p class="desc">从<b>海滨公路</b>出发，登上<b>城市高架</b>，冲进<b>霓虹街区</b>，闯过 1000m 终点！<br>橙色路锥可以跳过，护栏路障和车辆必须换道躲开。</p>
  <div class="keys">← → 换道 · ↑ / 空格 跳跃 · P 暂停 · M 静音</div>
  <div class="keys mobileHint">触屏：左右滑动换道 · 上滑跳跃</div>
  <div id="bestLine" class="best"></div>
  <button id="btnStart" class="btn primary">开 始 冲 刺</button>
  <div class="credit">伪 3D 透视引擎 · Canvas 2D · 无依赖单文件</div>
 </div>
</div>

<div id="endScreen" class="screen">
 <div class="card">
  <h2 id="endTitle">🏁 冲线成功！</h2>
  <div id="rating" class="rating">S</div>
  <div class="stats">
   <div class="stat"><span>用时</span><b id="stTime">-</b></div>
   <div class="stat"><span>金币</span><b id="stCoins">-</b></div>
   <div class="stat"><span>最高速度</span><b id="stSpeed">-</b></div>
   <div class="stat"><span>最佳纪录</span><b id="stBest">-</b></div>
  </div>
  <p id="endTip" class="tip"></p>
  <div class="row">
   <button id="btnRetry" class="btn primary">再跑一次</button>
   <button id="btnCopy" class="btn">复制链接</button>
  </div>
 </div>
</div>

<div id="pauseScreen" class="screen">
 <div class="card">
  <h2>⏸ 暂停中</h2>
  <button id="btnResume" class="btn primary">继 续</button>
 </div>
</div>
<script>
(function(){
'use strict';
/* ================= helpers ================= */
var TAU=Math.PI*2;
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function lerp(a,b,t){return a+(b-a)*t}
function sstep(t){t=clamp(t,0,1);return t*t*(3-2*t)}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hexRGB(c){var n=parseInt(c.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255]}
function rgbs(a){return 'rgb('+Math.round(a[0])+','+Math.round(a[1])+','+Math.round(a[2])+')'}
function rgbsA(a,al){return 'rgba('+Math.round(a[0])+','+Math.round(a[1])+','+Math.round(a[2])+','+al+')'}
function mixN(a,b,t){return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]}
function fmtTime(t){var m=Math.floor(t/60),s=t-m*60;return m+':'+(s<10?'0':'')+s.toFixed(1)}

/* ================= canvas / view ================= */
var cv=document.getElementById('game'),ctx=cv.getContext('2d');
var W=0,H=0,DPR=1,cx=0,focal=0,horizon=0;
function resize(){
 DPR=Math.min(2,window.devicePixelRatio||1);
 W=cv.clientWidth;H=cv.clientHeight;
 cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
 ctx.setTransform(DPR,0,0,DPR,0,0);
 cx=W/2;focal=H*0.92;horizon=H*0.40;
}
window.addEventListener('resize',resize);

/* ================= constants ================= */
var SEG=5,ROAD_HALF=5.25,TRACK=1000,SEGS_N=214;
var LANES=[-3.5,0,3.5];
var CAM_BACK=4.6,CAM_H=1.85,DRAW=76,FOG0=95,FOG1=345;
var GRAV=23,JUMPV=9.6,ACC=2.2,MAXSPD=34;
var BOARD=[{t:'喵屋',c:'#ff4fd8'},{t:'夜猫',c:'#26e6ff'},{t:'拉面',c:'#ffd34d'},{t:'GAME',c:'#7dff8a'},{t:'猫咖',c:'#ff8a5c'},{t:'24H',c:'#c86bff'}];
var SIGNS=['市区 2km','喵港大道','出口 17','滨海大桥'];
var CARCOLS=['#e05252','#4f9dde','#f2b23e','#67c23a','#e58fd2'];

/* ================= stages ================= */
var STAGES=[
 {name:'海滨公路',en:'SEASIDE ROAD',accent:'#39c6ff',
  skyTop:'#7ec8f7',skyBot:'#eaf7ff',sea:'#1f8fd0',sea2:'#7fd4f0',
  roadA:'#6f7a88',roadB:'#68737f',lane:'#f5f7fa',side:'#e9d8a8',sideB:'#dfcb96',
  rumA:'#e05a4e',rumB:'#f4f4f4',rail:'#e8eef4',wall:'#aeb9c4',wallTop:'#ccd6df',
  fog:'#dceefb'},
 {name:'城市高架',en:'CITY EXPRESSWAY',accent:'#ffb454',
  skyTop:'#46598e',skyBot:'#f0a868',sea:'#3a4d74',sea2:'#5a6f96',
  roadA:'#4d545f',roadB:'#464d57',lane:'#e8ecf2',side:'#8b93a0',sideB:'#828a97',
  rumA:'#d8dde5',rumB:'#ffffff',rail:'#d3dae2',wall:'#96a0ab',wallTop:'#bcc5cf',
  fog:'#e0ae87'},
 {name:'霓虹街区',en:'NEON DISTRICT',accent:'#26e6ff',
  skyTop:'#0a0e26',skyBot:'#341d55',sea:'#141a3a',sea2:'#232b55',
  roadA:'#262b38',roadB:'#212631',lane:'#9fb4ff',side:'#191d2c',sideB:'#141826',
  rumA:'#ff4fd8',rumB:'#26e6ff',rail:'#3a4260',wall:'#2a3050',wallTop:'#3c4468',
  fog:'#171034'}
];
var CKEYS=['skyTop','skyBot','sea','sea2','roadA','roadB','lane','side','sideB','rumA','rumB','rail','wall','wallTop','fog'];
STAGES.forEach(function(s){s.rgb={};CKEYS.forEach(function(k){s.rgb[k]=hexRGB(s[k])})});
function wStage(z){var t1=sstep((z-315)/55),t2=sstep((z-655)/55);return[1-t1,t1*(1-t2),t2]}
function stageIdxAt(z){return z<340?0:(z<680?1:2)}
function mixKey(key,w){var A=STAGES[0].rgb[key],B=STAGES[1].rgb[key],C=STAGES[2].rgb[key];
 return[A[0]*w[0]+B[0]*w[1]+C[0]*w[2],A[1]*w[0]+B[1]*w[1]+C[1]*w[2],A[2]*w[0]+B[2]*w[1]+C[2]*w[2]]}
var COLN={},COLS={};
function buildColors(w){CKEYS.forEach(function(k){COLN[k]=mixKey(k,w);COLS[k]=rgbs(COLN[k])})}

/* ================= track shape ================= */
function elev(z){
 if(z<340)return 0;
 if(z<520)return 7*sstep((z-340)/180);
 if(z<760)return 7;
 if(z<870)return 7*(1-sstep((z-760)/110));
 return 0;
}
var CURVE_PTS=[[0,0],[110,0],[150,.5],[210,-.5],[270,0],[345,0],[405,-.7],[475,.8],[545,0],[605,-.7],[665,0],[705,.55],[765,-.55],[825,0],[1200,0]];
function curveRaw(z){
 for(var i=0;i<CURVE_PTS.length-1;i++){var a=CURVE_PTS[i],b=CURVE_PTS[i+1];
  if(z<=b[0])return lerp(a[1],b[1],(z-a[0])/(b[0]-a[0]));}
 return 0;
}

/* ================= build segments ================= */
var segs=[],obstaclesSorted=[],coinsSorted=[],coinTotal=0;
function buildTrack(){
 segs=[];obstaclesSorted=[];coinsSorted=[];coinTotal=0;
 var rng=mulberry32(20261120);
 var i,z;
 for(i=0;i<SEGS_N;i++){
  z=i*SEG;
  segs.push({i:i,z:z,y1:elev(z),y2:elev(z+SEG),curve:curveRaw(z+SEG/2)*0.021,
   sprites:[],start:(z>=5&&z<10),finish:(z>=995&&z<1000),
   p1:null,p2:null,clip:0,fog:0,vis:false});
 }
 function segAt(zz){return segs[clamp(Math.floor(zz/SEG),0,SEGS_N-1)]}
 function pushSpr(zz,o){segAt(zz).sprites.push(o)}
 function addOb(zz,lane,type){var o={z:zz,lane:lane,type:type,hit:false,ci:(rng()*CARCOLS.length)|0,w:wStage(zz)};obstaclesSorted.push(o);pushSpr(zz,{kind:'ob',ref:o,z:zz})}
 function addCoin(zz,lane,y){var c={z:zz,lane:lane,y:y,taken:false};coinsSorted.push(c);pushSpr(zz,{kind:'coin',ref:c,z:zz})}
 function addGate(zz,text,sub,style){pushSpr(zz,{kind:'gate',z:zz,text:text,sub:sub,style:style,w:wStage(zz)})}
 function addSc(type,zz,x,extra){var o={kind:type,z:zz,x:x,s:(extra&&extra.s)||1,v:(extra&&extra.v)||0,y:(extra&&extra.y)||0,w:wStage(zz)};pushSpr(zz,o)}
 /* gates */
 addGate(6,'出发！','SEASIDE ROAD · 0M',0);
 addGate(338,'城市高架','CITY EXPRESSWAY · 340M',0);
 addGate(678,'霓虹街区','NEON DISTRICT · 680M',1);
 addGate(996,'FINISH','1000M GOAL',2);
 /* scenery */
 var side;
 for(i=0;i<SEGS_N;i++){
  z=segs[i].z;
  var st=stageIdxAt(z);
  if(st===0){
   if(i%3===0){side=((i/3)|0)%2?1:-1;addSc('palm',z+rng()*3,side*(ROAD_HALF+2.1+rng()*1.8),{s:0.85+rng()*0.45})}
   if(i%12===6){side=rng()<0.5?1:-1;addSc('umb',z+rng()*3,side*(ROAD_HALF+3.2+rng()*1.4),{v:(rng()*4)|0})}
   if(i%9===4){side=rng()<0.5?1:-1;addSc('gull',z+rng()*3,side*(6+rng()*7),{v:(rng()*5)|0,y:5.5+rng()*3})}
  }else if(st===1){
   if(i%5===0){side=(i%10<5)?1:-1;addSc('lamp',z,side*(ROAD_HALF+1.4),{})}
   if(i%10===5){addSc('sign',z,ROAD_HALF+2.4,{v:(rng()*SIGNS.length)|0})}
  }else{
   if(i%5===0){side=(i%10<5)?1:-1;addSc('board',z+rng()*2,side*(ROAD_HALF+2.6),{v:(rng()*BOARD.length)|0})}
   if(i%8===3){side=rng()<0.5?1:-1;addSc('lant',z,side*(ROAD_HALF+1.6),{v:(rng()*3)|0})}
  }
 }
 /* obstacles + coins */
 function nearGate(zz){return Math.abs(zz-338)<26||Math.abs(zz-678)<26||zz>912||zz<64}
 var zz=72,k,c,l,l1,l2,used,free,r,span;
 while(zz<950){
  if(nearGate(zz)){zz+=16;continue}
  r=rng();used={};span=14;
  if(r<0.16){l=(rng()*3)|0;used[l]=1;addOb(zz,l,'cone')}
  else if(r<0.32){l=(rng()*3)|0;used[l]=1;for(k=0;k<3;k++)addOb(zz+k*7,l,'cone');span=22}
  else if(r<0.50){l=(rng()*3)|0;used[l]=1;addOb(zz,l,'barrier')}
  else if(r<0.62){l1=(rng()*3)|0;l2=(l1+1+((rng()*2)|0))%3;used[l1]=1;used[l2]=1;addOb(zz,l1,'barrier');addOb(zz,l2,'barrier')}
  else if(r<0.76){l=(rng()*3)|0;used[l]=1;addOb(zz,l,'car')}
  else if(r<0.88){l1=(rng()*3)|0;l2=(l1+1+((rng()*2)|0))%3;used[l1]=1;used[l2]=1;addOb(zz,l1,'barrier');addOb(zz+6,l2,'cone');span=18}
  else{ /* zigzag coin trail */
   l=(rng()*3)|0;
   for(k=0;k<3;k++){for(c=0;c<4;c++)addCoin(zz+k*10+c*5.5,l,0.85);l=(l+1)%3}
   zz+=30+30+rng()*24;continue;
  }
  if(r>=0.16&&r<0.32&&rng()<0.5){ /* high coin row over the cone line */
   for(l in used){for(c=0;c<6;c++)addCoin(zz-2+c*6,+l,2.1)}
  }else{
   free=[0,1,2].filter(function(x){return !used[x]});
   l=free[(rng()*free.length)|0];
   for(c=0;c<6;c++)addCoin(zz-4+c*6.2,l,0.85);
  }
  zz+=span+28+rng()*26;
 }
 obstaclesSorted.sort(function(a,b){return a.z-b.z});
 coinsSorted.sort(function(a,b){return a.z-b.z});
 coinTotal=coinsSorted.length;
 segs.forEach(function(sg){sg.sprites.sort(function(a,b){return b.z-a.z})});
}

/* ================= sky deco ================= */
var stars=[],clouds=[],bldFar=[],bldNear=[],boats=[],PW=1800,skyBuilt=false;
function buildSkyDeco(){
 if(skyBuilt)return;skyBuilt=true;
 var r=mulberry32(777),i;

var AC=null,master=null,muted=false,nextT=0,stepN=0;
var PENT=[523.25,587.33,659.25,783.99,880,1046.5];
var LEAD=[0,-1,2,-1,4,3,2,0,4,-1,5,4,3,2,0,2,3,-1,4,3,2,-1,0,2,1,2,3,4,5,4,3,1];
var BASS=[130.81,174.61,196.00,164.81];
function initAudio(){
 if(AC)return;
 try{
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.gain.value=0.22;master.connect(AC.destination);
  nextT=AC.currentTime+0.1;
  setInterval(schedMusic,90);
 }catch(e){AC=null}
}
function tone(f0,f1,t0,dur,type,vol){
 if(!AC)return;
 var o=AC.createOscillator(),g=AC.createGain();
 o.type=type||'square';
 o.frequency.setValueAtTime(f0,t0);
 if(f1)o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t0+dur);
 g.gain.setValueAtTime(vol,t0);
 g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
 o.connect(g);g.connect(master);
 o.start(t0);o.stop(t0+dur+0.02);
}
function noiseAt(t0,dur,vol,fc){
 if(!AC)return;
 var n=Math.floor(AC.sampleRate*dur),buf=AC.createBuffer(1,n,AC.sampleRate),d=buf.getChannelData(0);
 for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
 var src=AC.createBufferSource();src.buffer=buf;
 var f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=fc;
 var g=AC.createGain();g.gain.value=vol;
 src.connect(f);f.connect(g);g.connect(master);
 src.start(t0);
}
function anow(){return AC?AC.currentTime:0}
var SND={
 coin:function(){tone(1046,1568,anow(),0.09,'square',0.16)},
 jump:function(){tone(240,660,anow(),0.16,'sine',0.2)},
 crash:function(){noiseAt(anow(),0.32,0.5,900);tone(180,50,anow(),0.4,'sawtooth',0.28)},
 stage:function(){var t=anow();[523,659,784,1046].forEach(function(f,i){tone(f,0,t+i*0.09,0.14,'triangle',0.15)})},
 finish:function(){var t=anow();[523,659,784,1046,1318,1568].forEach(function(f,i){tone(f,0,t+i*0.11,0.18,'triangle',0.16)})}
};
function schedMusic(){
 if(!AC)return;
 var spb=60/126/2;
 while(nextT<AC.currentTime+0.4){
  var s=stepN%32;
  if(s%8===0)tone(BASS[(s/8|0)%4],0,nextT,0.21,'triangle',0.10);
  var L=LEAD[s];
  if(L>=0)tone(PENT[L],0,nextT,0.12,'square',0.042);
  if(s%4===2)noiseAt(nextT,0.03,0.05,6000);
  stepN++;nextT+=spb;
 }
}

 for(var i=0;i<n;i++){var a=Math.random()*TAU,v=spd*(0.4+Math.random());
  spawnP(x,y,Math.cos(a)*v,Math.sin(a)*v-60,0.5+Math.random()*0.4,2+Math.random()*3,cols[(Math.random()*cols.length)|0],add,300)}

function updateParticles(dt){

  var p=particles[i];

  p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
 }

/* ================= update ================= */
function update(dt){
 timeNow+=dt;
 if(state==='title'){
  speed=12;pos+=speed*dt;
  if(pos>930){pos=0}
  playerZ=pos+CAM_BACK;runPhase+=dt*10;bgOff+=curveRaw(playerZ)*0.021*speed*dt*4;
  camX+=(0-camX)*Math.min(1,dt*4);
  camYabs=elev(pos)+CAM_H;
  updateParticles(dt);
  return;
 }
 if(state==='run'){timer+=dt;speed=Math.min(MAXSPD,speed+ACC*dt)}
 else if(state==='finish'){
  finishT+=dt;speed=Math.max(0,speed-16*dt);
  if(finishT>1.5&&!endShown)showEnd(true);
 }
 else if(state==='crash'){
  crashT+=dt;speed=Math.max(0,speed-46*dt);
  crashRot=Math.min(1.5,crashT*5)+Math.sin(crashT*18)*0.06*(1-Math.min(1,crashT));
  if(crashT>1.0&&!endShown)showEnd(false);
 }
 pos+=speed*dt;playerZ=pos+CAM_BACK;
 maxSpd=Math.max(maxSpd,speed);
 if(playerZ>=TRACK&&state==='run')doFinish();
 /* stage banner */
 var si=stageIdxAt(playerZ);
 if(si!==stageIdx){stageIdx=si;setStageBanner(si);SND.stage()}
 /* lane move */
 var tx=LANES[targetLane],dxl=tx-playerXm;
 if(queuedLane!==null&&Math.abs(dxl)<0.9){targetLane=queuedLane;queuedLane=null;tx=LANES[targetLane];dxl=tx-playerXm}
 playerXm+=dxl*Math.min(1,dt*10);
 var tl=clamp(dxl*0.28,-0.6,0.6);
 lean+= (tl-lean)*Math.min(1,dt*10);
 /* jump */
 if(jumping){
  vy-=GRAV*dt;playerY+=vy*dt;
  if(playerY<=0){playerY=0;vy=0;jumping=false;
   if(jumpBuf>0){jumpBuf=0;jumping=true;vy=JUMPV;SND.jump()}
  }
 }
 jumpBuf=Math.max(0,jumpBuf-dt);
 /* camera */
 camX+=(playerXm-camX)*Math.min(1,dt*8);
 camYabs=elev(pos)+CAM_H;
 runPhase+=dt*(8+speed*0.35);
 bgOff+=curveRaw(playerZ)*0.021*speed*dt*4;
 /* collisions */
 if(state==='run'){
  while(oi<obstaclesSorted.length&&obstaclesSorted[oi].z<playerZ-3)oi++;
  for(var k=oi;k<obstaclesSorted.length;k++){
   var o=obstaclesSorted[k];
   if(o.z>playerZ+3)break;
   if(o.hit)continue;
   if(Math.abs(o.z-playerZ)<2.2&&Math.abs(playerXm-LANES[o.lane])<1.35){
    if(o.type==='cone'&&playerY>0.5){o.hit=true;var sp=projW(LANES[o.lane],0.9,o.z);if(sp)burst(sp.x,sp.y,6,['#ffb46b','#ffe08a'],120,true)}
    else{doCrash();break}
   }
  }
  while(ci<coinsSorted.length&&coinsSorted[ci].z<playerZ-2.5)ci++;
  for(k=ci;k<coinsSorted.length;k++){
   var cc=coinsSorted[k];
   if(cc.z>playerZ+2.5)break;
   if(cc.taken)continue;
   if(Math.abs(cc.z-playerZ)<1.8&&Math.abs(playerXm-LANES[cc.lane])<1.2&&Math.abs(playerY+0.7-cc.y)<1.05){
    cc.taken=true;coins++;SND.coin();
    var sp2=projW(LANES[cc.lane],cc.y,cc.z);
    if(sp2)burst(sp2.x,sp2.y,8,['#ffd34d','#fff3c4','#ffb02e'],140,true);
   }
  }
 }
 /* run dust */
 if(!jumping&&speed>13&&state!=='crash'&&Math.random()<0.35){
  var sp3=focal/CAM_BACK,gy=horizon+(camYabs-elev(playerZ))*sp3,px=cx+(playerXm-camX)*sp3*0.55;
  spawnP(px+(Math.random()*30-15),gy,(Math.random()*60-30),-40-Math.random()*40,0.4,2+Math.random()*3,'rgba(255,255,255,0.5)',false,0);
 }
 updateParticles(dt);
 shake=Math.max(0,shake-46*dt);
 flash=Math.max(0,flash-dt*1.4);
 /* HUD */
 elCoin.textContent=coins;
 elSpd.textContent=Math.round(speed*3.6);
 elDist.textContent=Math.round(clamp(playerZ,0,TRACK))+' / '+TRACK+' m';
 elMarker.style.left=(clamp(playerZ,0,TRACK)/TRACK*100)+'%';
}

/* ================= road ================= */
function drawRoad(){
 var base=Math.max(0,Math.floor(pos/SEG));
 var frac=pos/SEG-base;
 var x=0,dx=-(segs[base].curve*frac);
 var maxY=H,i,n,side;
 function Pp(wx,wy,dz,sc,xoff){return{x:cx+sc*(wx-camX+xoff),y:horizon+sc*(camYabs-wy),s:sc}}
 for(n=0;n<DRAW;n++){
  i=base+n;if(i>=SEGS_N-1)break;
  var sg=segs[i],y2=sg.y2;
  var xoff1=x,xoff2=x+dx;
  x+=dx;dx+=sg.curve;
  var z1=sg.z-pos,z2=sg.z+SEG-pos;
  if(z2<=0.4){sg.vis=false;continue}
  var dz1=Math.max(z1,0.4),dz2=z2;
  var sc1=focal/dz1,sc2=focal/dz2;
  var eL1=Pp(-ROAD_HALF,sg.y1,dz1,sc1,xoff1),eR1=Pp(ROAD_HALF,sg.y1,dz1,sc1,xoff1);
  var eL2=Pp(-ROAD_HALF,y2,dz2,sc2,xoff2),eR2=Pp(ROAD_HALF,y2,dz2,sc2,xoff2);
  var c1=Pp(0,sg.y1,dz1,sc1,xoff1),c2=Pp(0,y2,dz2,sc2,xoff2);
  sg.p1=c1;sg.p2=c2;sg.clip=maxY;
  if(eL2.y>=maxY&&eR2.y>=maxY&&eL1.y>=maxY&&eR1.y>=maxY){sg.vis=false;continue}
  sg.vis=true;
  var f=clamp((z1-FOG0)/(FOG1-FOG0),0,1);sg.fog=f;
  /* side ground */
  quad(0,eL1.y,0,eL2.y,W,eR2.y,W,eR1.y,rgbs(fmix((i%2)?'side':'sideB',f)));
  /* rumble strips */
  var rw1=0.55*sc1,rw2=0.55*sc2;
  var rum=rgbs(fmix((i%2)?'rumA':'rumB',f));
  quad(eL1.x-rw1,eL1.y,eL1.x,eL1.y,eL2.x,eL2.y,eL2.x-rw2,eL2.y,rum);
  quad(eR1.x,eR1.y,eR1.x+rw1,eR1.y,eR2.x+rw2,eR2.y,eR2.x,eR2.y,rum);
  /* road surface */
  quad(eL1.x,eL1.y,eR1.x,eR1.y,eR2.x,eR2.y,eL2.x,eL2.y,rgbs(fmix((i%2)?'roadA':'roadB',f)));
  /* lane dashes + edge lines */
  if(i%2===0){
   var dashC=rgbsA(COLN.lane,(1-f)*0.8);
   for(var bIdx=0;bIdx<2;bIdx++){
    var bx=(bIdx===0?-1.75:1.75);
    quad(c1.x+(bx-0.07)*sc1,eL1.y,c1.x+(bx+0.07)*sc1,eR1.y,c2.x+(bx+0.07)*sc2,eR2.y,c2.x+(bx-0.07)*sc2,eL2.y,dashC);
   }
  }
  var edgeC=rgbsA([255,255,255],(1-f)*0.45);
  quad(c1.x+(-ROAD_HALF+0.08)*sc1,eL1.y,c1.x+(-ROAD_HALF+0.18)*sc1,eR1.y,c2.x+(-ROAD_HALF+0.18)*sc2,eR2.y,c2.x+(-ROAD_HALF+0.08)*sc2,eL2.y,edgeC);
  quad(c1.x+(ROAD_HALF-0.18)*sc1,eL1.y,c1.x+(ROAD_HALF-0.08)*sc1,eR1.y,c2.x+(ROAD_HALF-0.08)*sc2,eR2.y,c2.x+(ROAD_HALF-0.18)*sc2,eL2.y,edgeC);
  /* start / finish checker */
  if(sg.start||sg.finish){
   for(var cc=0;cc<12;cc++){
    var t0=cc/12,t1=(cc+1)/12;
    var nx1=lerp(eL1.x,eR1.x,t0),nx2=lerp(eL1.x,eR1.x,t1);
    var fx1=lerp(eL2.x,eR2.x,t0),fx2=lerp(eL2.x,eR2.x,t1);
    var col=((cc+i)%2)?CHK_L:CHK_D;
    quad(nx1,eL1.y,nx2,eR1.y,fx2,eR2.y,fx1,eL2.y,rgbs(mixN(col,COLN.fog,f*0.7)));
   }
  }
  /* walls + guardrails (follow road edges, never cut across) */
  for(side=-1;side<=1;side+=2){
   var wx0=side*(ROAD_HALF+0.55);
   var b1=Pp(wx0,sg.y1,dz1,sc1,xoff1),b2=Pp(wx0,y2,dz2,sc2,xoff2);
   var t1p=Pp(wx0,sg.y1+0.55,dz1,sc1,xoff1),t2p=Pp(wx0,y2+0.55,dz2,sc2,xoff2);
   quad(b1.x,b1.y,b2.x,b2.y,t2p.x,t2p.y,t1p.x,t1p.y,rgbs(fmix('wall',f)));
   ctx.strokeStyle=rgbsA(fmix('wallTop',f),1-f*0.9);
   ctx.lineWidth=Math.max(1,0.1*sc1);
   ctx.beginPath();ctx.moveTo(t1p.x,t1p.y);ctx.lineTo(t2p.x,t2p.y);ctx.stroke();
   var rx=side*(ROAD_HALF+0.75);
   var rt1=Pp(rx,sg.y1+0.95,dz1,sc1,xoff1),rt2=Pp(rx,y2+0.95,dz2,sc2,xoff2);
   var rb1=Pp(rx,sg.y1+0.55,dz1,sc1,xoff1),rb2=Pp(rx,y2+0.55,dz2,sc2,xoff2);
   if(i%3===0){
    ctx.strokeStyle=rgbsA(fmix('rail',f),1-f);
    ctx.lineWidth=Math.max(1,0.09*sc1);
    ctx.beginPath();ctx.moveTo(rb1.x,rb1.y);ctx.lineTo(rt1.x,rt1.y);ctx.stroke();
   }
   var railA=1-f;
   if(railA>0.04){
    var neon=wStage(sg.z)[2];
    if(neon>0.35&&sc1>1.6){
     ctx.strokeStyle=(i%6<3)?'rgba(38,230,255,'+railA+')':'rgba(255,79,216,'+railA+')';

    }else{

    }
    ctx.lineWidth=Math.max(1,0.1*sc1);
    ctx.beginPath();ctx.moveTo(rt1.x,rt1.y);ctx.lineTo(rt2.x,rt2.y);ctx.stroke();
    ctx.shadowBlur=0;
   }
  }
  maxY=Math.min(maxY,eL2.y,eR2.y);
 }
}

  i=base+n;if(i>=SEGS_N)continue;

}
function drawNearSprites(){

 for(i=base;i<=Math.min(SEGS_N-1,base+2);i++){
  var sg=segs[i];
  if(!sg.vis||!sg.p1)continue;
  var a=Math.max(0.15,1-sg.fog);
  for(m=0;m<sg.sprites.length;m++){
   var sp=sg.sprites[m];
   if(sp.z>=pos+4.4||sp.z<pos+0.8)continue;
   drawSprite(sp,sg,a);

}
function drawSprite(sp,sg,a){
 var t=(sp.z-sg.z)/SEG;
 var px=lerp(sg.p1.x,sg.p2.x,t),py=lerp(sg.p1.y,sg.p2.y,t),sc=lerp(sg.p1.s,sg.p2.s,t);
 if(py>sg.clip+2)return;
 ctx.globalAlpha=a;
 switch(sp.kind){
  case 'coin':if(!sp.ref.taken)drawCoin(px+LANES[sp.ref.lane]*sc,py,sc,sp.ref);break;
  case 'ob':drawOb(sp.ref,px+LANES[sp.ref.lane]*sc,py,sc);break;
  case 'gate':drawGate(sp,px,py,sc);break;
  case 'palm':drawPalm(px+sp.x*sc,py,sc*sp.s,sp.v);break;
  case 'umb':drawUmb(px+sp.x*sc,py,sc,sp.v);break;
  case 'gull':drawGull(sp,px+sp.x*sc,py,sc);break;
  case 'lamp':drawLamp(sp,px+sp.x*sc,py,sc);break;
  case 'sign':drawSign(px+sp.x*sc,py,sc,sp.v);break;
  case 'board':drawBoard(sp,px+sp.x*sc,py,sc);break;

}

 ctx.beginPath();ctx.moveTo(x,y-5.2*u);ctx.quadraticCurveTo(x+dir*0.6*u,y-5.5*u,x+dir*1.1*u,y-5.0*u);ctx.stroke();
 var hx=x+dir*1.1*u,hy=y-5.0*u;
 ctx.shadowColor='rgba(255,217,160,0.9)';ctx.shadowBlur=10*u*0.3;
 ctx.fillStyle='#ffd9a0';
 ctx.beginPath();ctx.ellipse(hx,hy,0.18*u,0.1*u,0,0,TAU);ctx.fill();
 ctx.shadowBlur=0;
}
function drawSign(x,y,u,v){
 if(u<0.35)return;
 shadowE(x,y,0.5*u,0.12*u,0.22);
 ctx.strokeStyle='#7c8792';ctx.lineWidth=0.1*u;
 ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y-2.7*u);ctx.stroke();
 ctx.fillStyle='#1f7a44';
 rrPath(x-1.25*u,y-3.15*u,2.5*u,0.85*u,0.08*u);ctx.fill();
 ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(1,0.05*u);
 rrPath(x-1.25*u,y-3.15*u,2.5*u,0.85*u,0.08*u);ctx.stroke();
 if(u>1.1){
  ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='700 '+Math.floor(0.4*u)+'px "PingFang SC",sans-serif';
  ctx.fillText(SIGNS[v%SIGNS.length],x,y-3.15*u+0.44*u);
 }
}
function drawBoard(sp,x,y,u){
 if(u<0.3)return;
 var b=BOARD[sp.v%BOARD.length];
 var fl=0.82+0.18*Math.sin(timeNow*11+sp.v*7);
 shadowE(x,y,0.9*u,0.15*u,0.25);
 ctx.fillStyle='#1a2030';
 ctx.fillRect(x-0.07*u,y-1.05*u,0.14*u,1.05*u);
 ctx.globalAlpha*=fl;
 ctx.fillStyle='#0d1126';
 rrPath(x-1.35*u,y-2.95*u,2.7*u,1.75*u,0.1*u);ctx.fill();
 ctx.shadowColor=b.c;ctx.shadowBlur=12;
 ctx.strokeStyle=b.c;ctx.lineWidth=Math.max(1,0.09*u);
 rrPath(x-1.35*u,y-2.95*u,2.7*u,1.75*u,0.1*u);ctx.stroke();
 if(u>0.9){
  ctx.fillStyle=b.c;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='900 '+Math.floor(0.68*u)+'px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(b.t,x,y-2.95*u+0.9*u);
 }
 ctx.shadowBlur=0;
 ctx.globalAlpha/=fl;
}
function drawLant(x,y,u){
 if(u<0.35)return;
 ctx.strokeStyle='#2c3242';ctx.lineWidth=0.1*u;
 ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y-2.4*u);ctx.stroke();
 ctx.shadowColor='rgba(255,90,79,0.9)';ctx.shadowBlur=10;
 ctx.fillStyle='#ff5a4f';
 ctx.beginPath();ctx.ellipse(x-0.28*u,y-2.2*u,0.2*u,0.24*u,0,0,TAU);ctx.ellipse(x+0.28*u,y-2.2*u,0.2*u,0.24*u,0,0,TAU);ctx.fill();
 ctx.shadowBlur=0;
 ctx.fillStyle='#ffd34d';
 ctx.fillRect(x-0.34*u,y-2.5*u,0.12*u,0.06*u);ctx.fillRect(x+0.22*u,y-2.5*u,0.12*u,0.06*u);
}

/* ================= player cat ================= */
function drawPlayer(){
 var sp3=focal/CAM_BACK;
 var gy=horizon+(camYabs-elev(playerZ))*sp3;
 var px=cx+(playerXm-camX)*sp3*0.55;
 var py=gy-playerY*sp3;
 var shA=clamp(0.35-playerY*0.09,0.08,0.35);
 var shR=(0.62-playerY*0.06)*sp3;
 shadowE(px,gy+0.03*sp3,shR,shR*0.3,shA);
 drawCat(px,py,sp3,{phase:runPhase,air:playerY>0.05,lean:lean,rot:state==='crash'?crashRot:0,t:timeNow});
}
function drawCat(x,y,u,o){
 var ph=o.phase||0,t=o.t||0,air=o.air;
 var bob=air?0:Math.abs(Math.sin(ph))*0.05*u;
 var body='#f6a53e',outline='rgba(122,74,18,0.45)';
 ctx.save();
 ctx.translate(x,y);
 ctx.rotate((o.rot||0)+(o.lean||0)*0.5);
 ctx.lineJoin='round';ctx.lineCap='round';
 var lw=Math.max(1,0.022*u);
 function leg(lx,lift){
  ctx.fillStyle=body;
  rrPath(lx-0.06*u,-0.32*u,0.12*u,0.32*u-lift,0.05*u);ctx.fill();
  ctx.strokeStyle=outline;ctx.lineWidth=lw;ctx.stroke();
  ctx.fillStyle='#fff4e3';
  ctx.beginPath();ctx.ellipse(lx,-lift+0.01*u,0.055*u,0.035*u,0,0,TAU);ctx.fill();
 }
 var l1=air?0.08*u:Math.max(0,Math.sin(ph))*0.1*u;
 var l2=air?0.08*u:Math.max(0,Math.sin(ph+Math.PI))*0.1*u;
 /* tail */
 var sway=Math.sin(t*7)*0.1*u+(o.lean||0)*u*0.35;
 ctx.strokeStyle=body;ctx.lineWidth=0.1*u;
 ctx.beginPath();ctx.moveTo(0.02*u,-0.28*u-bob);
 ctx.quadraticCurveTo(0.34*u+sway,-0.3*u-bob,0.42*u+sway*1.7,-0.74*u-bob);
 ctx.stroke();
 ctx.fillStyle='#fff4e3';
 ctx.beginPath();ctx.arc(0.42*u+sway*1.7,-0.74*u-bob,0.07*u,0,TAU);ctx.fill();
 /* back legs */
 leg(-0.19*u,l1);leg(0.15*u,l2);
 /* body */
 ctx.fillStyle=body;
 ctx.beginPath();ctx.ellipse(0,-0.48*u-bob,0.335*u,0.3*u,0,0,TAU);ctx.fill();
 ctx.strokeStyle=outline;ctx.lineWidth=lw;ctx.stroke();
 ctx.strokeStyle='rgba(200,120,25,0.8)';ctx.lineWidth=0.05*u;
 var s2;
 for(s2=0;s2<3;s2++){
  var sy=-0.36*u-s2*0.13*u-bob;
  ctx.beginPath();ctx.moveTo(-0.2*u,sy);ctx.quadraticCurveTo(0,sy-0.07*u,0.2*u,sy);ctx.stroke();
 }
 /* front legs */
 leg(-0.09*u,l2);leg(0.22*u,l1);
 /* scarf */
 var fl=Math.sin(t*9)*0.05*u+0.05*u,wob=Math.sin(t*9+1)*0.04*u;
 ctx.fillStyle='#c93e38';
 ctx.beginPath();
 ctx.moveTo(-0.18*u,-0.72*u-bob);
 ctx.quadraticCurveTo(-0.45*u-fl,-0.7*u-bob+wob,-0.62*u-fl*1.5,-0.56*u-bob+wob*2);
 ctx.lineTo(-0.48*u-fl,-0.66*u-bob);
 ctx.closePath();ctx.fill();
 ctx.fillStyle='#e8504a';
 rrPath(-0.2*u,-0.78*u-bob,0.4*u,0.11*u,0.04*u);ctx.fill();
 /* head */
 ctx.fillStyle=body;
 ctx.beginPath();ctx.arc(0,-0.99*u-bob,0.3*u,0,TAU);ctx.fill();
 ctx.strokeStyle=outline;ctx.lineWidth=lw;ctx.stroke();
 ctx.fillStyle=body;
 ctx.beginPath();
 ctx.moveTo(-0.22*u,-1.12*u-bob);ctx.lineTo(-0.17*u,-1.36*u-bob);ctx.lineTo(-0.02*u,-1.2*u-bob);ctx.closePath();ctx.fill();ctx.stroke();
 ctx.beginPath();
 ctx.moveTo(0.22*u,-1.12*u-bob);ctx.lineTo(0.17*u,-1.36*u-bob);ctx.lineTo(0.02*u,-1.2*u-bob);ctx.closePath();ctx.fill();ctx.stroke();
 ctx.fillStyle='#f7b8c4';
 ctx.beginPath();
 ctx.moveTo(-0.175*u,-1.18*u-bob);ctx.lineTo(-0.155*u,-1.3*u-bob);ctx.lineTo(-0.08*u,-1.2*u-bob);ctx.closePath();ctx.fill();
 ctx.beginPath();
 ctx.moveTo(0.175*u,-1.18*u-bob);ctx.lineTo(0.155*u,-1.3*u-bob);ctx.lineTo(0.08*u,-1.2*u-bob);ctx.closePath();ctx.fill();
 /* blush + whisker hints */
 ctx.fillStyle='rgba(255,140,160,0.5)';
 ctx.beginPath();ctx.arc(-0.24*u,-0.94*u-bob,0.045*u,0,TAU);ctx.arc(0.24*u,-0.94*u-bob,0.045*u,0,TAU);ctx.fill();
 ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=Math.max(1,0.02*u);
 ctx.beginPath();
 ctx.moveTo(-0.3*u,-0.96*u-bob);ctx.lineTo(-0.4*u,-0.99*u-bob);
 ctx.moveTo(0.3*u,-0.96*u-bob);ctx.lineTo(0.4*u,-0.99*u-bob);
 ctx.stroke();
 ctx.restore();
}

/* ================= effects ================= */
function drawParticles(){
 var i,p;
 for(i=0;i<particles.length;i++){
  p=particles[i];
  var a=clamp(p.life/p.life0,0,1);
  ctx.save();
  if(p.add)ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha=a;
  ctx.fillStyle=p.col;
  ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill();
  ctx.restore();
 }
}
function drawSpeedLines(){
 if(speed<=25)return;
 var a=clamp((speed-25)/9,0,1)*0.15;
 ctx.strokeStyle='rgba(255,255,255,'+a.toFixed(3)+')';
 ctx.lineWidth=2;
 var i;
 for(i=0;i<10;i++){
  var ang=(i/10)*TAU+timeNow*2.2;
  var r0=H*0.3,r1=r0+H*(0.22+0.1*Math.sin(timeNow*7+i));
  ctx.beginPath();
  ctx.moveTo(cx+Math.cos(ang)*r0,horizon*0.9+Math.sin(ang)*r0);
  ctx.lineTo(cx+Math.cos(ang)*r1,horizon*0.9+Math.sin(ang)*r1);
  ctx.stroke();
 }
}
function drawVignette(){
 var g=ctx.createRadialGradient(cx,H*0.45,H*0.3,cx,H*0.5,H*0.78);
 g.addColorStop(0,'rgba(6,10,20,0)');
 g.addColorStop(1,'rgba(6,10,20,0.38)');
 ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,H+40);
}
function drawHaze(){
 var top=horizon-26;
 var g=ctx.createLinearGradient(0,top,0,horizon+32);
 g.addColorStop(0,rgbsA(COLN.fog,0));
 g.addColorStop(0.45,rgbsA(COLN.fog,0.55));
 g.addColorStop(1,rgbsA(COLN.fog,0));
 ctx.fillStyle=g;ctx.fillRect(-20,top,W+40,58);
}

/* ================= render frame ================= */
function render(){
 var w=wStage(playerZ);
 buildColors(w);
 ctx.save();
 ctx.translate((Math.random()*2-1)*shake,(Math.random()*2-1)*shake*0.7);
 drawSky(w);
 drawRoad();
 drawHaze();
 drawSprites();
 drawPlayer();
 drawNearSprites();
 drawParticles();
 drawSpeedLines();
 drawVignette();
 if(flash>0){ctx.fillStyle='rgba(255,60,60,'+(flash*0.5).toFixed(3)+')';ctx.fillRect(-20,-20,W+40,H+40)}
 ctx.restore();
}

/* ================= boot ================= */
buildTrack();
resize();
buildSkyDeco();
reset(true);
refreshBest();
var qs=new URLSearchParams(location.search);
if(qs.has('go')||qs.has('shot')){
 beginRun(false);
 if(qs.has('skip')){
  pos=parseFloat(qs.get('skip'))||0;
  playerZ=pos+CAM_BACK;speed=24;camYabs=elev(pos)+CAM_H;
 }
 if(qs.has('shot')){
  var secs=parseFloat(qs.get('shot'))||0.2;
  var nstep=Math.max(1,Math.round(secs*60));
  for(var q=0;q<nstep;q++)update(1/60);
  frozen=true;
 }
}
var last=performance.now();
function frame(now){
 requestAnimationFrame(frame);
 var dt=Math.min(0.05,(now-last)/1000);
 last=now;
 if(!paused&&!frozen)update(dt);
 render();
}
requestAnimationFrame(frame);
})();
</script>
</body>
